version: 3.8

services:
  mongo:
    image: mongo:latest
    container_name: mongo_db
    command: mongod --quiet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 27018:27017
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  api:
    build: .
    container_name: backend_api
    ports:
      - 3000:3000
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.container
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
